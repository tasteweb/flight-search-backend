<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flight Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Find Your Flight</h1>
    <p class="subtitle">
      Search available flights and request booking assistance from our travel agency.
    </p>

    <form id="searchForm" class="card">
      <div class="row trip-type">

        <div>
          <label>Trip Type</label>
          <select id="tripType">
            <option value="oneway">One Way</option>
            <option value="roundtrip">Round Trip</option>
          </select>
        </div>
      </div>

      <div class="row route">

        <div>
          <label>From</label>
          <input type="text" id="origin" placeholder="JFK" required />
        </div>

        <div>
          <label>To</label>
          <input type="text" id="destination" placeholder="LHR" required />
        </div>
      </div>

      <div class="row dates">

        <div class="date">
          <label>Departure Date</label>
          <input type="date" id="date" required />
        </div>

        <div id="returnDateContainer" class="date hidden">
          <label>Return Date</label>
          <input type="date" id="returnDate" />
        </div>

        <div class="adults">
          <label>Adults</label>
          <input type="number" id="adults" value="1" min="1" />
        </div>
      </div>

      <button type="submit" class="primary-btn">Search Flights</button>
    </form>

    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
